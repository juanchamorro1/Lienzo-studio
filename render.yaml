databases:
  - name: estudio-lienzo-db
    plan: free
    region: oregon

services:
  - type: web
    name: estudio-lienzo-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: estudio-lienzo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        sync: false
      - key: ADMIN_EMAIL
        value: admin@console.com
      - key: ADMIN_PASSWORD
        sync: false
